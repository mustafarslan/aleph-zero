[project]
name = "aleph-zero"
version = "0.1.1"
description = "Local-first code intelligence for coding agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Mustafa Arslan" }]
dependencies = [
  # 0.26.0 segfaults when node positions are read across large trees
  # (tests/test_tree_sitter_stability.py); 0.25.2 is clean.
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-language-pack>=1.21,<2",
  "numpy>=2.0",
  "apsw>=3.53",
]

[project.urls]
Homepage = "https://github.com/mustafarslan/aleph-zero"
Issues = "https://github.com/mustafarslan/aleph-zero/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  # Not imported by the server (ADR-009). Its client checks our server's conformance,
  # and bench/spikes/transport.py measures against its server.
  "mcp>=2.3,<3",
]
bench = [
  "huggingface-hub>=0.30",
  "onnxruntime>=1.31",
  "tokenizers>=0.23",
  "pyarrow>=17",
  "nanobind>=2.0",
]

[project.scripts]
aleph = "aleph_zero.cli:main"
# The same command under a name no other program has: TeX Live installs an `aleph` of its own.
aleph-zero = "aleph_zero.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Always uv's own CPython build, so the bundled SQLite is the same everywhere.
python-preference = "only-managed"

# The embed worker is llama.cpp's own server, built by bench/spikes/build_llama.sh.
# llama-cpp-python is not used: 0.3.36 cannot load EmbeddingGemma 2 and its macOS
# arm64 wheels are corrupt upstream (ADR-001).
