name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # macOS runners are free on a public repository and billed at ten times the rate on a private one.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
